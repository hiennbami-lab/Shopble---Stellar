basePath: /api/v1
definitions:
  libstellar.PaymentInstruction:
    properties:
      amount:
        type: string
      asset_code:
        type: string
      asset_issuer:
        type: string
      destination:
        type: string
      memo:
        type: string
      memo_type:
        example: MEMO_TEXT
        type: string
      network:
        type: string
      uri:
        description: Uri — payload SEP-0007, dán thẳng vào ví hoặc render thành QR.
        type: string
    type: object
  v1.CreateOrderData:
    properties:
      instruction:
        $ref: '#/definitions/libstellar.PaymentInstruction'
      order:
        $ref: '#/definitions/v1.OrderDto'
    type: object
  v1.CreateOrderEnvelope:
    properties:
      data:
        $ref: '#/definitions/v1.CreateOrderData'
      status:
        example: ok
        type: string
    type: object
  v1.CreateOrderRequest:
    properties:
      buyer_wallet:
        description: BuyerWallet — địa chỉ ví Stellar đã connect (G..., 56 ký tự).
        example: GA7QYNF7SOWQ3GLR2BGMZEHXAVIRZA4KVWLTJJFC7MGXUA74P7UJVSGZ
        type: string
      expected_amount:
        description: ExpectedAmount — số tiền kỳ vọng, dạng chuỗi thập phân, tối đa
          7 chữ số lẻ.
        example: "25.5"
        type: string
      product_ref:
        description: ProductRef — product/source context của order.
        example: sku-1024
        maxLength: 255
        type: string
    required:
    - buyer_wallet
    - expected_amount
    - product_ref
    type: object
  v1.ErrorData:
    properties:
      error_code:
        example: DATA_INVALID
        type: string
      message:
        type: string
    type: object
  v1.ErrorResponse:
    properties:
      data:
        $ref: '#/definitions/v1.ErrorData'
      status:
        example: error
        type: string
    type: object
  v1.EvidenceDto:
    properties:
      amount:
        type: string
      asset_code:
        type: string
      asset_issuer:
        type: string
      captured_at:
        type: integer
      destination_account:
        type: string
      detection_latency_seconds:
        description: DetectionLatencySeconds — captured_at trừ ledger_close_at.
        type: integer
      explorer_url:
        type: string
      id:
        type: string
      ledger_close_at:
        type: integer
      memo:
        type: string
      op_id:
        type: string
      order_id:
        type: string
      reject_reason:
        type: string
      source_account:
        type: string
      tx_hash:
        type: string
      verdict:
        example: matched
        type: string
    type: object
  v1.EvidenceListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/v1.EvidenceDto'
        type: array
      status:
        example: ok
        type: string
    type: object
  v1.FieldComparison:
    properties:
      expected:
        type: string
      field:
        example: asset_code
        type: string
      match:
        type: boolean
      observed:
        type: string
    type: object
  v1.OrderDto:
    properties:
      asset_code:
        type: string
      asset_issuer:
        type: string
      buyer_wallet:
        type: string
      created_at:
        type: integer
      destination_account:
        type: string
      expected_amount:
        example: "25.5000000"
        type: string
      id:
        type: string
      memo:
        type: string
      on_chain_tx_hash:
        type: string
      product_ref:
        type: string
      reject_reason:
        type: string
      status:
        example: awaiting_payment
        type: string
      updated_at:
        type: integer
    type: object
  v1.OrderEnvelope:
    properties:
      data:
        $ref: '#/definitions/v1.OrderDto'
      status:
        example: ok
        type: string
    type: object
  v1.OrderEvidenceData:
    properties:
      evidence:
        items:
          $ref: '#/definitions/v1.OrderEvidenceDto'
        type: array
      order:
        $ref: '#/definitions/v1.OrderDto'
    type: object
  v1.OrderEvidenceDto:
    properties:
      comparison:
        items:
          $ref: '#/definitions/v1.FieldComparison'
        type: array
      evidence:
        $ref: '#/definitions/v1.EvidenceDto'
    type: object
  v1.OrderEvidenceEnvelope:
    properties:
      data:
        $ref: '#/definitions/v1.OrderEvidenceData'
      status:
        example: ok
        type: string
    type: object
  v1.OrderListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/v1.OrderDto'
        type: array
      status:
        example: ok
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    Stablecoin checkout & order reconciliation prototype trên Stellar TESTNET.
    Toàn bộ scope là testnet — không có giá trị thật nào được chuyển.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Shopble API
  version: "1.0"
paths:
  /evidence:
    get:
      description: 'Nguồn cho bảng kết quả 15 transaction của SOW Deliverable 2: mỗi
        dòng có tx hash, link Stellar Expert, verdict và detection latency.'
      parameters:
      - description: Lọc theo order
        in: query
        name: order_id
        type: string
      - description: 'Lọc theo verdict: matched | rejected | duplicate'
        in: query
        name: verdict
        type: string
      - description: Mặc định 50, tối đa 200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.EvidenceListEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Liệt kê payment evidence thô đọc từ ledger
      tags:
      - evidence
  /orders:
    get:
      parameters:
      - description: Địa chỉ ví buyer
        in: query
        name: buyer_wallet
        required: true
        type: string
      - description: Mặc định 50, tối đa 200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.OrderListEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Liệt kê order intent của một ví buyer
      tags:
      - orders
    post:
      consumes:
      - application/json
      parameters:
      - description: Order intent
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.CreateOrderEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Tạo order intent và sinh payment instruction testnet
      tags:
      - orders
  /orders/{id}:
    get:
      parameters:
      - description: Order id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.OrderEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Đọc một order intent kèm trạng thái hiện tại
      tags:
      - orders
  /orders/{id}/evidence:
    get:
      description: 'View cho người review theo SOW: order intent, mọi payment đã quan
        sát cho order đó, và so sánh từng field.'
      parameters:
      - description: Order id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/v1.OrderEvidenceEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/v1.ErrorResponse'
      summary: Order kèm bằng chứng, dạng expected-versus-observed
      tags:
      - evidence
swagger: "2.0"
