server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The stellar-sdk bundle is the bulk of this app; serving it uncompressed is the
    # difference between a fast load and a slow one.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS. Without re-resolution nginx caches the API container's IP
    # at startup and keeps talking to a dead address after the API restarts — and the
    # API is configured to restart on any exit.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # Same-origin backend, so the browser makes no cross-origin request and the API's
    # CORS middleware is irrelevant (it is disabled entirely at RELEASE_MODE=prod).
    location /api/ {
        proxy_pass $api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass $api$request_uri;
        access_log off;
    }

    # Vite fingerprints these filenames, so they can never go stale.
    location /assets/ {
        # One header, not `expires` plus add_header — those emit Cache-Control twice.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is what points at the new hashed bundles, so a
    # cached copy makes a deploy invisible until someone hard-refreshes.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # No client-side router today, but a refresh on any path should still land on the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
